# Daily report / dashboard (Phase 4).
top_plays_per_sport: 12
slip_legs: [2, 3]          # the report's pick'em section: best 2-3 leg entries
top_slips: 6
output_dir: null            # default: <data_dir>/reports (gitignored); latest.html = newest
quota_warn_pct: 80         # warn when the 30-day quota use passes this share of the budget

# "Top picks" box at the top of the dashboard.
top_picks: 3
# Ranking score = edge % x this weight, so a well-sourced 5% edge can beat a
# shaky 7% one. One pick per player (or per game line).
confidence_weight: {high: 1.0, medium: 0.75, low: 0.5}

# Dashboard "Refresh odds" button (only when viewed through `betedge serve`).
# Minimum minutes between refreshes: SGO's free plan updates odds about every
# 10 minutes, so refreshing faster spends quota without newer prices.
refresh_cooldown_minutes: 5
